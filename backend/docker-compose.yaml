services:
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_DB: "job_tracker"
      POSTGRES_PASSWORD: "password"
      REDIS_HOST: redis
    expose:
      - 8000
    command: ["fastapi", "run", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - db
  
  db:
    image: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "job_tracker"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  
  redis:
    image: redis:8
  
  celery:
    build: .
    command: ["celery", "-A", "app.worker.tasks", "worker", "--loglevel=info"]
    environment:
      REDIS_HOST: redis


volumes:
  postgres_data:

    